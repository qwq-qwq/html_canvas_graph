version: '3.8'

services:
  # Приложение HTML Canvas Graph
  canvas-app:
    image: canvas-graph:latest
    container_name: canvas-graph
    restart: unless-stopped
    networks:
      - app-network

  # Мониторинг (опционально)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    expose:
      - 9090
    networks:
      - app-network

  # Визуализация метрик (опционально)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=secret
      - GF_USERS_ALLOW_SIGN_UP=false
    expose:
      - 3000
    networks:
      - app-network

  # Кэширование (опционально)
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - 6379
    networks:
      - app-network

  # Автоматическое обновление контейнеров
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 86400 --cleanup
    networks:
      - app-network

volumes:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  app-network:
    external: true  # Используем внешнюю сеть для связи с Jenkins 